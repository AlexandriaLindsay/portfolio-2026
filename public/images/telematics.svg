<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="Arial, Helvetica, sans-serif">

  <!-- Background -->
  <rect width="1600" height="1000" fill="#f0eeee"/>

  <!-- ══════════════════ HEADER ══════════════════ -->
  <rect width="1600" height="60" fill="#111111"/>

  <!-- Logo mark: diamond -->
  <path d="M 24 30 L 40 16 L 56 30 L 40 44 Z" fill="none" stroke="white" stroke-width="2.5"/>
  <text x="40" y="35" font-size="13" font-weight="900" fill="white" text-anchor="middle">T</text>

  <!-- Logo wordmark -->
  <text x="68" y="38" font-size="20" font-weight="700" fill="white" letter-spacing="4">TELE</text>
  <text x="136" y="38" font-size="15" fill="#aaaaaa">Telematics</text>

  <!-- Log out -->
  <text x="1568" y="38" font-size="13" fill="#777777" text-anchor="end">Log out</text>

  <!-- ══════════════════ FILTER CARD ══════════════════ -->
  <rect x="22" y="72" width="1556" height="152" fill="white" stroke="#e0e0e0" stroke-width="1"/>
  <rect x="22" y="72" width="1556" height="4" fill="#e8a020"/>

  <!-- Date Range -->
  <text x="56" y="108" font-size="12" fill="#999999">Select Date Range</text>
  <rect x="56" y="116" width="290" height="36" fill="white" stroke="#cccccc" stroke-width="1"/>
  <text x="201" y="139" font-size="13" fill="#444444" text-anchor="middle">2024-06-01</text>
  <text x="360" y="139" font-size="20" fill="#666666" text-anchor="middle">→</text>
  <rect x="376" y="116" width="290" height="36" fill="white" stroke="#cccccc" stroke-width="1"/>
  <text x="521" y="139" font-size="13" fill="#444444" text-anchor="middle">2025-06-01</text>

  <!-- Scrapers -->
  <text x="820" y="108" font-size="12" fill="#999999">Select Scrapers</text>
  <rect x="820" y="116" width="718" height="36" fill="white" stroke="#cccccc" stroke-width="1"/>
  <rect x="830" y="124" width="58" height="20" fill="#7668c4" rx="3"/>
  <text x="859" y="138" font-size="11" fill="white" text-anchor="middle">× 1296</text>

  <!-- Buttons -->
  <rect x="1248" y="174" width="136" height="36" fill="#e8a020" rx="2"/>
  <text x="1316" y="197" font-size="13" font-weight="600" fill="white" text-anchor="middle">Reset Dates</text>
  <rect x="1398" y="174" width="154" height="36" fill="#111111" rx="2"/>
  <text x="1475" y="197" font-size="13" font-weight="600" fill="white" text-anchor="middle">View Results</text>

  <!-- ══════════════════ PERFORMANCE SECTION ══════════════════ -->
  <rect x="0" y="238" width="1600" height="762" fill="#edeaea"/>
  <text x="56" y="280" font-size="16" font-weight="700" fill="#333333" letter-spacing="1.5">PERFORMANCE RESULTS</text>

  <!--
    Card grid: 3 cols × 2 rows
    col x:      24 | 548 | 1072
    card width: 502
    row y:      296 | 556
    card height: 242
  -->

  <!-- ─── ROW 1 CARD 1 · Total Load Count ─── -->
  <rect x="24" y="296" width="502" height="242" fill="#e4e0e0" stroke="#d0cccc" stroke-width="1"/>
  <!-- Circular arrows -->
  <circle cx="152" cy="417" r="56" fill="none" stroke="#111111" stroke-width="3.5"/>
  <polygon points="138,361 152,378 166,361" fill="#111111"/>
  <polygon points="138,473 152,456 166,473" fill="#111111"/>
  <!-- Scraper body -->
  <rect x="118" y="405" width="68" height="16" fill="#111111" rx="2"/>
  <path d="M 110 421 L 196 421 L 200 433 L 106 433 Z" fill="#111111"/>
  <circle cx="124" cy="438" r="7" fill="#111111"/>
  <circle cx="166" cy="438" r="7" fill="#111111"/>
  <!-- Metric -->
  <text x="378" y="407" font-size="64" font-weight="700" fill="#7668c4" text-anchor="middle">713</text>
  <text x="378" y="442" font-size="12" font-weight="600" fill="#555555" text-anchor="middle" letter-spacing="2">TOTAL LOAD COUNT</text>

  <!-- ─── ROW 1 CARD 2 · Total Material Moved ─── -->
  <rect x="548" y="296" width="502" height="242" fill="#e4e0e0" stroke="#d0cccc" stroke-width="1"/>
  <!-- Shovel handle -->
  <line x1="702" y1="342" x2="740" y2="422" stroke="#111111" stroke-width="11" stroke-linecap="round"/>
  <circle cx="696" cy="337" r="10" fill="#111111"/>
  <!-- Blade -->
  <path d="M 736 420 Q 744 458 762 470 Q 788 480 798 456 Q 806 430 780 412 Z" fill="#111111"/>
  <!-- Dirt mound -->
  <ellipse cx="768" cy="478" rx="46" ry="13" fill="#111111"/>
  <!-- Metric -->
  <text x="912" y="393" font-size="50" font-weight="700" fill="#7668c4" text-anchor="middle">13,893</text>
  <text x="912" y="430" font-size="22" font-weight="700" fill="#7668c4" text-anchor="middle">yd³</text>
  <text x="912" y="458" font-size="12" font-weight="600" fill="#555555" text-anchor="middle" letter-spacing="2">TOTAL MATERIAL MOVED</text>

  <!-- ─── ROW 1 CARD 3 · Total Load Weight ─── -->
  <rect x="1072" y="296" width="502" height="242" fill="#e4e0e0" stroke="#d0cccc" stroke-width="1"/>
  <!-- Hook -->
  <path d="M 1216 368 A 20 20 0 0 1 1256 368" fill="none" stroke="#111111" stroke-width="9" stroke-linecap="round"/>
  <!-- Weight block -->
  <path d="M 1192 380 L 1280 380 L 1294 462 L 1178 462 Z" fill="#111111"/>
  <!-- Metric -->
  <text x="1440" y="393" font-size="30" font-weight="700" fill="#7668c4" text-anchor="middle">33,343,260</text>
  <text x="1440" y="424" font-size="20" font-weight="700" fill="#7668c4" text-anchor="middle">lb</text>
  <text x="1440" y="452" font-size="12" font-weight="600" fill="#555555" text-anchor="middle" letter-spacing="2">TOTAL LOAD WEIGHT</text>

  <!-- ─── ROW 2 CARD 1 · Avg Cycle Time ─── -->
  <rect x="24" y="556" width="502" height="242" fill="#e4e0e0" stroke="#d0cccc" stroke-width="1"/>
  <!-- Clock face -->
  <circle cx="152" cy="677" r="52" fill="none" stroke="#111111" stroke-width="3.5"/>
  <line x1="152" y1="636" x2="152" y2="677" stroke="#111111" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="152" y1="677" x2="182" y2="677" stroke="#111111" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="152" cy="677" r="4" fill="#111111"/>
  <!-- Circular arrows around clock -->
  <path d="M 86 644 A 78 78 0 0 1 218 644" fill="none" stroke="#111111" stroke-width="2.5"/>
  <polygon points="222,638 212,654 227,656" fill="#111111"/>
  <path d="M 86 710 A 78 78 0 0 0 218 710" fill="none" stroke="#111111" stroke-width="2.5"/>
  <polygon points="82,704 92,720 77,722" fill="#111111"/>
  <!-- Metric -->
  <text x="378" y="668" font-size="64" font-weight="700" fill="#7668c4" text-anchor="middle">09:48</text>
  <text x="378" y="706" font-size="12" font-weight="600" fill="#555555" text-anchor="middle" letter-spacing="2">AVG. CYCLE TIME (MM:SS)</text>

  <!-- ─── ROW 2 CARD 2 · Avg Material Moved / Load ─── -->
  <rect x="548" y="556" width="502" height="242" fill="#e4e0e0" stroke="#d0cccc" stroke-width="1"/>
  <!-- Bar chart -->
  <rect x="668" y="672" width="18" height="50" fill="#111111"/>
  <rect x="694" y="656" width="18" height="66" fill="#111111"/>
  <rect x="720" y="640" width="18" height="82" fill="#111111"/>
  <rect x="746" y="652" width="18" height="70" fill="#111111"/>
  <rect x="772" y="632" width="18" height="90" fill="#111111"/>
  <line x1="660" y1="722" x2="800" y2="722" stroke="#111111" stroke-width="3"/>
  <line x1="660" y1="624" x2="660" y2="722" stroke="#111111" stroke-width="3"/>
  <line x1="800" y1="722" x2="832" y2="616" stroke="#111111" stroke-width="3"/>
  <polygon points="836,608 818,620 830,632" fill="#111111"/>
  <!-- Metric -->
  <text x="912" y="664" font-size="64" font-weight="700" fill="#7668c4" text-anchor="middle">19</text>
  <text x="912" y="702" font-size="22" font-weight="700" fill="#7668c4" text-anchor="middle">yd³</text>
  <text x="912" y="728" font-size="12" font-weight="600" fill="#555555" text-anchor="middle" letter-spacing="2">AVG. MATERIAL MOVED / LOAD</text>

  <!-- ─── ROW 2 CARD 3 · Avg Load Weight ─── -->
  <rect x="1072" y="556" width="502" height="242" fill="#e4e0e0" stroke="#d0cccc" stroke-width="1"/>
  <!-- Three ascending people with bars -->
  <circle cx="1168" cy="658" r="11" fill="#111111"/>
  <rect x="1160" y="672" width="16" height="52" fill="#111111" rx="2"/>
  <circle cx="1200" cy="646" r="11" fill="#111111"/>
  <rect x="1192" y="660" width="16" height="64" fill="#111111" rx="2"/>
  <circle cx="1232" cy="632" r="11" fill="#111111"/>
  <rect x="1224" y="646" width="16" height="78" fill="#111111" rx="2"/>
  <line x1="1152" y1="724" x2="1260" y2="724" stroke="#111111" stroke-width="3"/>
  <line x1="1152" y1="620" x2="1152" y2="724" stroke="#111111" stroke-width="3"/>
  <line x1="1260" y1="724" x2="1288" y2="618" stroke="#111111" stroke-width="3"/>
  <polygon points="1292,610 1274,622 1286,634" fill="#111111"/>
  <!-- Metric -->
  <text x="1440" y="662" font-size="48" font-weight="700" fill="#7668c4" text-anchor="middle">46,765</text>
  <text x="1440" y="700" font-size="20" font-weight="700" fill="#7668c4" text-anchor="middle">lb</text>
  <text x="1440" y="726" font-size="12" font-weight="600" fill="#555555" text-anchor="middle" letter-spacing="2">AVG. LOAD WEIGHT</text>

</svg>
